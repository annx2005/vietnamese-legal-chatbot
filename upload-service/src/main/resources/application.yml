server:
  port: ${PORT:${UPLOAD_SERVICE_PORT:8080}}
  servlet:
    context-path: /api/v1/upload

spring:
  application:
    name: upload-service
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 55MB
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/legal_rag_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:2}
      minimum-idle: ${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:0}
      idle-timeout: ${SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT:10000}
      max-lifetime: ${SPRING_DATASOURCE_HIKARI_MAX_LIFETIME:600000}
  cloud:
    gcp:
      project-id: ${PROJECT_ID:legal-chatbot-496302}
      storage:
        bucket: ${UPLOAD_BUCKET_NAME:legal-rag-docs-local}
      pubsub:
        topic: ${PUBSUB_TOPIC_NAME:legal-document-uploaded-prod}

springdoc:
  packages-to-scan: com.example.upload_service.controller
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: always

app:
  jwt:
    secret: ${JWT_SECRET_KEY:super-secret-jwt-key-change-in-production}
