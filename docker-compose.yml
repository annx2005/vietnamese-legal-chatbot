services:
  # Infrastructure services
  postgres:
    image: postgres:16-alpine
    container_name: local-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-legal_rag_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - legal-network
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: local-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - legal-network
    restart: unless-stopped

  # Application services
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: legal-rag-frontend
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      - VITE_API_PROXY_TARGET=http://api-gateway:8080
    networks:
      - legal-network
    depends_on:
      - api-gateway
    restart: unless-stopped

  api-gateway:
    image: kong:3.8
    container_name: api-gateway
    ports:
      - "${API_GATEWAY_PORT:-8080}:8080"
      - "${KONG_ADMIN_PORT:-18001}:8001"
    environment:
      - KONG_DATABASE=off
      - KONG_DECLARATIVE_CONFIG=/kong/declarative/kong.yml
      - KONG_PROXY_LISTEN=0.0.0.0:8080
      - KONG_ADMIN_LISTEN=0.0.0.0:8001
      - KONG_LOG_LEVEL=info
    volumes:
      - ./kong-gateway/kong.yml:/kong/declarative/kong.yml:ro
    networks:
      - legal-network
    depends_on:
      - auth-service
      - upload-service
      - rag-service
      - ingestion-service
    restart: unless-stopped

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    ports:
      - "${AUTH_SERVICE_PORT:-8081}:8080"
    environment:
      - DATABASE_URL=jdbc:postgresql://postgres:5432/${DB_NAME:-legal_rag_db}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-super-secret-jwt-key-change-in-production}
      - JWT_EXPIRATION_TIME=${JWT_EXPIRATION_TIME:-86400}
    networks:
      - legal-network
    depends_on:
      - postgres
    restart: unless-stopped

  upload-service:
    build:
      context: ./upload-service
      dockerfile: Dockerfile
    container_name: upload-service
    ports:
      - "${UPLOAD_SERVICE_PORT:-8082}:8080"
    environment:
      - PROJECT_ID=${PROJECT_ID}
      - UPLOAD_BUCKET_NAME=${UPLOAD_BUCKET_NAME}
      - PUBSUB_TOPIC_NAME=${PUBSUB_TOPIC_NAME}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-super-secret-jwt-key-change-in-production}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${DB_NAME:-legal_rag_db}
      - SPRING_DATASOURCE_USERNAME=${DB_USER:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-postgres}
      - GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_APPLICATION_CREDENTIALS:-/var/run/gcp/application_default_credentials.json}
    volumes:
      - type: bind
        source: ${GCP_CREDENTIALS_DIR:-./.secrets/gcp}
        target: /var/run/gcp
        read_only: true
    networks:
      - legal-network
    depends_on:
      - postgres
    restart: unless-stopped

  rag-service:
    build:
      context: ./rag-service
      dockerfile: Dockerfile
    container_name: rag-service
    ports:
      - "${RAG_SERVICE_PORT:-8000}:8000"
    environment:
      - GCP_PROJECT_ID=${PROJECT_ID}
      - GCP_LOCATION=${GCP_REGION:-asia-southeast1}
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - COLLECTION_NAME=${COLLECTION_NAME:-legal_documents}
      - EMBEDDING_MODEL_NAME=${EMBEDDING_MODEL_NAME:-text-embedding-005}
      - LLM_MODEL_NAME=${LLM_MODEL_NAME:-gemini-2.5-flash}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-super-secret-jwt-key-change-in-production}
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-legal_rag_db}
      - GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_APPLICATION_CREDENTIALS:-/var/run/gcp/application_default_credentials.json}
    volumes:
      - type: bind
        source: ${GCP_CREDENTIALS_DIR:-./.secrets/gcp}
        target: /var/run/gcp
        read_only: true
    networks:
      - legal-network
    depends_on:
      - qdrant
      - postgres
    restart: unless-stopped

  ingestion-service:
    build:
      context: ./ingestion-service
      dockerfile: Dockerfile
    container_name: ingestion-service
    ports:
      - "${INGESTION_SERVICE_PORT:-8001}:8000"
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - COLLECTION_NAME=${COLLECTION_NAME:-legal_documents}
      - GCP_PROJECT_ID=${PROJECT_ID}
      - GCP_LOCATION=${GCP_REGION:-asia-southeast1}
      - GCS_BUCKET_NAME=${UPLOAD_BUCKET_NAME}
      - EMBEDDING_MODEL_NAME=${EMBEDDING_MODEL_NAME:-text-embedding-005}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-super-secret-jwt-key-change-in-production}
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-legal_rag_db}
      - GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_APPLICATION_CREDENTIALS:-/var/run/gcp/application_default_credentials.json}
    volumes:
      - type: bind
        source: ${GCP_CREDENTIALS_DIR:-./.secrets/gcp}
        target: /var/run/gcp
        read_only: true
    networks:
      - legal-network
    depends_on:
      - qdrant
      - postgres
    restart: unless-stopped

networks:
  legal-network:
    driver: bridge

volumes:
  postgres_data:
  qdrant_data:
