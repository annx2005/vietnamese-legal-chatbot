name: Build and Deploy GKE

on:
  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - "frontend/**"
      - "api-router/**"
      - "auth-service/**"
      - "upload-service/**"
      - "ingestion-service/**"
      - "rag-service/**"
      - "charts/legal-rag/**"
      - ".github/workflows/deploy-gke.yml"
  workflow_dispatch:
    inputs:
      cutover_cloud_run:
        description: "Revoke public Cloud Run access after GKE smoke tests pass"
        required: true
        default: false
        type: boolean

env:
  TF_IN_AUTOMATION: "true"
  PROJECT_ID: legal-chatbot-496302
  REGION: asia-southeast1
  ENV: prod
  BUCKET_NAME: vietnamese-legal-rag-documents
  GKE_CLUSTER: legal-rag-gke-prod
  GKE_NAMESPACE: legal-rag-prod
  REGISTRY: asia-southeast1-docker.pkg.dev/legal-chatbot-496302/legal-rag-repo-prod
  USE_GKE_GCLOUD_AUTH_PLUGIN: "True"
  WIF_PROVIDER: "projects/1038257786675/locations/global/workloadIdentityPools/github-actions-pool-prod/providers/github-provider"
  CICD_SERVICE_ACCOUNT: "legal-rag-cicd-prod@legal-chatbot-496302.iam.gserviceaccount.com"

jobs:
  detect-changes:
    name: Detect Deployment Changes
    runs-on: ubuntu-latest
    permissions:
      contents: "read"
      pull-requests: "read"
    outputs:
      terraform: ${{ github.event_name == 'workflow_dispatch' && 'false' || steps.filter.outputs.terraform }}
      chart: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.chart }}
      services: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.services }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Detect Changed Paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            terraform:
              - 'terraform/**'
            chart:
              - 'charts/legal-rag/**'
            services:
              - 'frontend/**'
              - 'api-router/**'
              - 'auth-service/**'
              - 'upload-service/**'
              - 'ingestion-service/**'
              - 'rag-service/**'
              - '.github/workflows/deploy-gke.yml'

  terraform-apply:
    name: Apply Terraform
    needs: detect-changes
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: "read"
      id-token: "write"
    env:
      TF_VAR_project_id: ${{ vars.TF_VAR_PROJECT_ID != '' && vars.TF_VAR_PROJECT_ID || 'legal-chatbot-496302' }}
      TF_VAR_region: ${{ vars.TF_VAR_REGION != '' && vars.TF_VAR_REGION || 'asia-southeast1' }}
      TF_VAR_environment: ${{ vars.TF_VAR_ENVIRONMENT != '' && vars.TF_VAR_ENVIRONMENT || 'prod' }}
      TF_VAR_bucket_name: ${{ vars.TF_VAR_BUCKET_NAME != '' && vars.TF_VAR_BUCKET_NAME || 'vietnamese-legal-rag-documents' }}
      TF_VAR_github_repo: ${{ vars.TF_VAR_GITHUB_REPO != '' && vars.TF_VAR_GITHUB_REPO || github.repository }}
    steps:
      - name: Skip When No Terraform Changes
        if: ${{ needs.detect-changes.outputs.terraform != 'true' }}
        run: echo "No Terraform changes detected."

      - name: Checkout Source Code
        if: ${{ needs.detect-changes.outputs.terraform == 'true' }}
        uses: actions/checkout@v4

      - name: Google Auth (Workload Identity Federation)
        if: ${{ needs.detect-changes.outputs.terraform == 'true' }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "${{ env.WIF_PROVIDER }}"
          service_account: "${{ env.CICD_SERVICE_ACCOUNT }}"
          create_credentials_file: true
          export_environment_variables: true

      - name: Set up Terraform
        if: ${{ needs.detect-changes.outputs.terraform == 'true' }}
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"

      - name: Terraform Init
        if: ${{ needs.detect-changes.outputs.terraform == 'true' }}
        working-directory: terraform
        run: terraform init -input=false

      - name: Terraform Validate
        if: ${{ needs.detect-changes.outputs.terraform == 'true' }}
        working-directory: terraform
        run: terraform validate -no-color

      - name: Terraform Plan
        if: ${{ needs.detect-changes.outputs.terraform == 'true' }}
        working-directory: terraform
        run: |-
          terraform plan -input=false -no-color -out=tfplan
          terraform show -no-color tfplan > tfplan.txt

      - name: Publish Terraform Summary
        if: ${{ needs.detect-changes.outputs.terraform == 'true' }}
        working-directory: terraform
        run: |-
          {
            echo "## Terraform Apply Plan"
            echo
            echo '```text'
            sed -n '1,200p' tfplan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Terraform Apply
        if: ${{ needs.detect-changes.outputs.terraform == 'true' }}
        working-directory: terraform
        run: terraform apply -input=false -auto-approve tfplan

  deploy-gke:
    name: Build Images and Deploy to GKE
    needs:
      - detect-changes
      - terraform-apply
    if: ${{ needs.detect-changes.outputs.chart == 'true' || needs.detect-changes.outputs.services == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: "read"
      id-token: "write"
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Google Auth (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          token_format: "access_token"
          workload_identity_provider: "${{ env.WIF_PROVIDER }}"
          service_account: "${{ env.CICD_SERVICE_ACCOUNT }}"

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: gke-gcloud-auth-plugin

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Docker Auth to Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Build and Push Images
        run: |-
          for service in frontend api-router auth-service upload-service ingestion-service rag-service; do
            docker build -t "${REGISTRY}/${service}:${GITHUB_SHA}" "./${service}"
            docker push "${REGISTRY}/${service}:${GITHUB_SHA}"
          done

      - name: Connect to GKE
        run: |-
          gcloud container clusters get-credentials "${GKE_CLUSTER}" \
            --region="${REGION}" \
            --project="${PROJECT_ID}"

      - name: Prepare Helm Namespace
        run: |-
          kubectl create namespace "${GKE_NAMESPACE}" --dry-run=client -o yaml | kubectl apply -f -
          kubectl label namespace "${GKE_NAMESPACE}" app.kubernetes.io/managed-by=Helm --overwrite
          kubectl annotate namespace "${GKE_NAMESPACE}" \
            meta.helm.sh/release-name=legal-rag \
            meta.helm.sh/release-namespace="${GKE_NAMESPACE}" \
            --overwrite

      - name: Sync Runtime Secrets
        run: |-
          DB_PASSWORD="$(gcloud secrets versions access latest --secret=legal-rag-db-password-${ENV})"
          QDRANT_URL="$(gcloud secrets versions access latest --secret=qdrant-url-${ENV})"
          QDRANT_API_KEY="$(gcloud secrets versions access latest --secret=qdrant-api-key-${ENV})"
          JWT_SECRET_KEY="$(gcloud secrets versions access latest --secret=legal-rag-jwt-secret-${ENV})"
          ADMIN_PASSWORD="$(gcloud secrets versions access latest --secret=legal-rag-admin-password-${ENV})"

          kubectl -n "${GKE_NAMESPACE}" create secret generic legal-rag-secrets \
            --from-literal=DB_PASSWORD="${DB_PASSWORD}" \
            --from-literal=SPRING_DATASOURCE_PASSWORD="${DB_PASSWORD}" \
            --from-literal=QDRANT_URL="${QDRANT_URL}" \
            --from-literal=QDRANT_API_KEY="${QDRANT_API_KEY}" \
            --from-literal=JWT_SECRET_KEY="${JWT_SECRET_KEY}" \
            --from-literal=ADMIN_PASSWORD="${ADMIN_PASSWORD}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Adopt Existing Resources for Helm
        run: |-
          resources=(
            "serviceaccount/legal-rag-app"
            "configmap/legal-rag-config"
            "backendconfig.cloud.google.com/api-router-backendconfig"
            "service/frontend"
            "service/api-router"
            "service/auth-service"
            "service/upload-service"
            "service/rag-service"
            "service/ingestion-service"
            "deployment/frontend"
            "deployment/api-router"
            "deployment/auth-service"
            "deployment/upload-service"
            "deployment/rag-service"
            "deployment/ingestion-service"
            "deployment/ingestion-worker"
            "ingress.networking.k8s.io/legal-rag-ingress"
          )

          for resource in "${resources[@]}"; do
            kubectl -n "${GKE_NAMESPACE}" label "${resource}" app.kubernetes.io/managed-by=Helm --overwrite || true
            kubectl -n "${GKE_NAMESPACE}" annotate "${resource}" \
              meta.helm.sh/release-name=legal-rag \
              meta.helm.sh/release-namespace="${GKE_NAMESPACE}" \
              --overwrite || true
          done

      - name: Deploy Helm Chart
        run: |-
          helm upgrade --install legal-rag charts/legal-rag \
            --namespace "${GKE_NAMESPACE}" \
            --create-namespace \
            -f charts/legal-rag/values-prod.yaml \
            --set global.imageTag="${GITHUB_SHA}" \
            --wait \
            --timeout 15m

      - name: Wait for Rollouts
        run: |-
          for deployment in frontend api-router auth-service upload-service rag-service ingestion-service ingestion-worker; do
            kubectl -n "${GKE_NAMESPACE}" rollout status "deployment/${deployment}" --timeout=900s
          done

      - name: Smoke Test Internal API
        run: |-
          kubectl -n "${GKE_NAMESPACE}" exec deploy/api-router -- \
            wget -qO- http://api-router:8080/api/v1/rag/health

          kubectl -n "${GKE_NAMESPACE}" exec deploy/api-router -- \
            wget -qO- http://api-router:8080/api/v1/ingest/health

      - name: Show GKE Ingress
        run: |-
          kubectl -n "${GKE_NAMESPACE}" get ingress legal-rag-ingress
          echo "Ingress IP may take a few minutes to appear after the first deploy."

      - name: Cut Over from Cloud Run
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.cutover_cloud_run }}
        run: |-
          for service in frontend api-router auth-service upload-service ingestion-service rag-service; do
            gcloud run services remove-iam-policy-binding "${service}-${ENV}" \
              --region="${REGION}" \
              --member=allUsers \
              --role=roles/run.invoker \
              --quiet || true
          done
          echo "Cloud Run public access revoked. Use the manual Cloud Run workflows for rollback."
