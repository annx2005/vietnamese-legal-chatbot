name: Manual Rollback - Build and Deploy Backend Services to Cloud Run

on:
  workflow_dispatch:

env:
  PROJECT_ID: legal-chatbot-496302
  REGION: asia-southeast1
  ENV: prod
  WIF_PROVIDER: "projects/1038257786675/locations/global/workloadIdentityPools/github-actions-pool-prod-v2/providers/github-provider"
  CICD_SERVICE_ACCOUNT: "legal-rag-cicd-prod@legal-chatbot-496302.iam.gserviceaccount.com"
  APP_SERVICE_ACCOUNT: "legal-rag-app-prod@legal-chatbot-496302.iam.gserviceaccount.com"

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      auth: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.auth }}
      upload: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.upload }}
      ingestion: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.ingestion }}
      rag: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.rag }}
      api_router: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.api_router }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            auth:
              - 'auth-service/**'
              - '.github/workflows/deploy-backend.yml'
            upload:
              - 'upload-service/**'
              - '.github/workflows/deploy-backend.yml'
            ingestion:
              - 'ingestion-service/**'
              - '.github/workflows/deploy-backend.yml'
            rag:
              - 'rag-service/**'
              - '.github/workflows/deploy-backend.yml'
            api_router:
              - 'api-router/**'
              - '.github/workflows/deploy-backend.yml'

  deploy-backends:
    name: Deploy Backend Services
    needs: detect-changes
    runs-on: ubuntu-latest
    permissions:
      contents: "read"
      id-token: "write"
    strategy:
      max-parallel: 4
      fail-fast: false
      matrix:
        include:
          - service: auth-service
            changed: ${{ needs.detect-changes.outputs.auth == 'true' }}
            cloudsql: "legal-chatbot-496302:asia-southeast1:legal-rag-db-prod"
            env_vars: |-
              DATABASE_URL=jdbc:postgresql:///metadata_db?cloudSqlInstance=legal-chatbot-496302:asia-southeast1:legal-rag-db-prod&socketFactory=com.google.cloud.sql.postgres.SocketFactory
              DB_USER=legal_app_user
              SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE=2
              SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE=0
              SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT=10000
              SPRING_DATASOURCE_HIKARI_MAX_LIFETIME=600000
            secrets: |-
              DB_PASSWORD=legal-rag-db-password-prod:latest
          - service: upload-service
            changed: ${{ needs.detect-changes.outputs.upload == 'true' }}
            cloudsql: "legal-chatbot-496302:asia-southeast1:legal-rag-db-prod"
            env_vars: |-
              PROJECT_ID=legal-chatbot-496302
              UPLOAD_BUCKET_NAME=vietnamese-legal-rag-documents
              PUBSUB_TOPIC_NAME=legal-document-uploaded-prod
              SPRING_DATASOURCE_URL=jdbc:postgresql:///metadata_db?cloudSqlInstance=legal-chatbot-496302:asia-southeast1:legal-rag-db-prod&socketFactory=com.google.cloud.sql.postgres.SocketFactory
              SPRING_DATASOURCE_USERNAME=legal_app_user
              SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE=2
              SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE=0
              SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT=10000
              SPRING_DATASOURCE_HIKARI_MAX_LIFETIME=600000
            secrets: |-
              DB_PASSWORD=legal-rag-db-password-prod:latest
              SPRING_DATASOURCE_PASSWORD=legal-rag-db-password-prod:latest
          - service: ingestion-service
            changed: ${{ needs.detect-changes.outputs.ingestion == 'true' }}
            cloudsql: "legal-chatbot-496302:asia-southeast1:legal-rag-db-prod"
            env_vars: |-
              GCP_PROJECT_ID=legal-chatbot-496302
              GCP_LOCATION=asia-southeast1
              GCS_BUCKET_NAME=vietnamese-legal-rag-documents
              PUBSUB_TOPIC=legal-document-uploaded-prod
              CLOUD_SQL_CONNECTION_NAME=legal-chatbot-496302:asia-southeast1:legal-rag-db-prod
              DB_USER=legal_app_user
              DB_NAME=metadata_db
              COLLECTION_NAME=legal_documents_prod
              EMBEDDING_MODEL_NAME=text-embedding-005
              QDRANT_SPARSE_VECTOR_NAME=bm25_sparse_vector
              BM25_AVG_LEN=0
              BM25_LANGUAGE=none
              BM25_TOKENIZER=multilingual
              BM25_ASCII_FOLDING=true
            secrets: |-
              DB_PASSWORD=legal-rag-db-password-prod:latest
              QDRANT_URL=qdrant-url-prod:latest
              QDRANT_API_KEY=qdrant-api-key-prod:latest
          - service: rag-service
            changed: ${{ needs.detect-changes.outputs.rag == 'true' }}
            cloudsql: "legal-chatbot-496302:asia-southeast1:legal-rag-db-prod"
            env_vars: |-
              GCP_PROJECT_ID=legal-chatbot-496302
              GCP_LOCATION=asia-southeast1
              CLOUD_SQL_CONNECTION_NAME=legal-chatbot-496302:asia-southeast1:legal-rag-db-prod
              DB_USER=legal_app_user
              DB_NAME=metadata_db
              COLLECTION_NAME=legal_documents_prod
              EMBEDDING_MODEL_NAME=text-embedding-005
              LLM_MODEL_NAME=gemini-2.5-flash
              SEARCH_MODE=hybrid
              QDRANT_SPARSE_VECTOR_NAME=bm25_sparse_vector
              BM25_LANGUAGE=none
              BM25_TOKENIZER=multilingual
              BM25_ASCII_FOLDING=true
              HYBRID_DENSE_PREFETCH_MULTIPLIER=4
              HYBRID_SPARSE_PREFETCH_MULTIPLIER=4
            secrets: |-
              DB_PASSWORD=legal-rag-db-password-prod:latest
              QDRANT_URL=qdrant-url-prod:latest
              QDRANT_API_KEY=qdrant-api-key-prod:latest

    steps:
      - name: Checkout Source Code
        if: matrix.changed
        uses: actions/checkout@v4

      - name: Google Auth (Workload Identity Federation)
        if: matrix.changed
        id: auth
        uses: google-github-actions/auth@v2
        with:
          token_format: "access_token"
          workload_identity_provider: "${{ env.WIF_PROVIDER }}"
          service_account: "${{ env.CICD_SERVICE_ACCOUNT }}"

      - name: Set up Cloud SDK
        if: matrix.changed
        uses: google-github-actions/setup-gcloud@v2

      - name: Docker Auth to Artifact Registry
        if: matrix.changed
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Build and Push Docker Image
        if: matrix.changed
        run: |-
          IMAGE_NAME="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/legal-rag-repo-${{ env.ENV }}/${{ matrix.service }}:${{ github.sha }}"
          cd ${{ matrix.service }}
          docker build -t $IMAGE_NAME .
          docker push $IMAGE_NAME

      - name: Deploy to Cloud Run
        if: matrix.changed
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: "${{ matrix.service }}-${{ env.ENV }}"
          region: "${{ env.REGION }}"
          image: "${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/legal-rag-repo-${{ env.ENV }}/${{ matrix.service }}:${{ github.sha }}"
          env_vars: ${{ matrix.env_vars }}
          secrets: ${{ matrix.secrets }}
          flags: >-
            --allow-unauthenticated
            --port=8080
            --service-account=${{ env.APP_SERVICE_ACCOUNT }}
            --clear-vpc-connector
            ${{ matrix.cloudsql != '' && format('--add-cloudsql-instances={0}', matrix.cloudsql) || '' }}

  configure-ingestion:
    name: Configure Ingestion Subscription
    needs: [detect-changes, deploy-backends]
    if: ${{ needs.detect-changes.outputs.ingestion == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: "read"
      id-token: "write"
    steps:
      - name: Google Auth (Workload Identity Federation)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          token_format: "access_token"
          workload_identity_provider: "${{ env.WIF_PROVIDER }}"
          service_account: "${{ env.CICD_SERVICE_ACCOUNT }}"

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Resolve Ingestion URL
        id: ingestion-url
        run: echo "url=$(gcloud run services describe ingestion-service-${{ env.ENV }} --region=${{ env.REGION }} --format='value(status.url)')" >> "$GITHUB_OUTPUT"

      - name: Configure Pub/Sub Push Subscription
        run: |-
          gcloud pubsub subscriptions update legal-document-ingestion-sub-${{ env.ENV }} \
            --push-endpoint="${{ steps.ingestion-url.outputs.url }}/api/v1/ingest/events/document-uploaded"

  deploy-api-router:
    name: Deploy API Router
    needs: [detect-changes, deploy-backends]
    if: ${{ needs.detect-changes.outputs.api_router == 'true' || needs.detect-changes.outputs.auth == 'true' || needs.detect-changes.outputs.upload == 'true' || needs.detect-changes.outputs.ingestion == 'true' || needs.detect-changes.outputs.rag == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: "read"
      id-token: "write"
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Google Auth (Workload Identity Federation)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          token_format: "access_token"
          workload_identity_provider: "${{ env.WIF_PROVIDER }}"
          service_account: "${{ env.CICD_SERVICE_ACCOUNT }}"

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Docker Auth to Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Resolve Backend URLs
        id: backend-urls
        run: |-
          echo "auth_url=$(gcloud run services describe auth-service-${{ env.ENV }} --region=${{ env.REGION }} --format='value(status.url)')" >> "$GITHUB_OUTPUT"
          echo "upload_url=$(gcloud run services describe upload-service-${{ env.ENV }} --region=${{ env.REGION }} --format='value(status.url)')" >> "$GITHUB_OUTPUT"
          echo "ingestion_url=$(gcloud run services describe ingestion-service-${{ env.ENV }} --region=${{ env.REGION }} --format='value(status.url)')" >> "$GITHUB_OUTPUT"
          echo "rag_url=$(gcloud run services describe rag-service-${{ env.ENV }} --region=${{ env.REGION }} --format='value(status.url)')" >> "$GITHUB_OUTPUT"

      - name: Build and Push API Router Image
        run: |-
          IMAGE_NAME="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/legal-rag-repo-${{ env.ENV }}/api-router:${{ github.sha }}"
          cd api-router
          docker build -t $IMAGE_NAME .
          docker push $IMAGE_NAME

      - name: Deploy API Router
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: "api-router-${{ env.ENV }}"
          region: "${{ env.REGION }}"
          image: "${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/legal-rag-repo-${{ env.ENV }}/api-router:${{ github.sha }}"
          env_vars: |-
            AUTH_SERVICE_URL=${{ steps.backend-urls.outputs.auth_url }}
            UPLOAD_SERVICE_URL=${{ steps.backend-urls.outputs.upload_url }}
            INGESTION_SERVICE_URL=${{ steps.backend-urls.outputs.ingestion_url }}
            RAG_SERVICE_URL=${{ steps.backend-urls.outputs.rag_url }}
          flags: >-
            --allow-unauthenticated
            --port=8080
            --service-account=${{ env.APP_SERVICE_ACCOUNT }}
