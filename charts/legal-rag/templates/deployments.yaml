apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: {{ .Values.namespace.name }}
  labels:
{{ include "legal-rag.labels" (dict "root" . "component" "frontend") | indent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
{{ include "legal-rag.selectorLabels" (dict "component" "frontend") | indent 6 }}
  template:
    metadata:
      labels:
{{ include "legal-rag.selectorLabels" (dict "component" "frontend") | indent 8 }}
{{ include "legal-rag.labels" (dict "root" . "component" "frontend") | indent 8 }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
{{ include "legal-rag.podSecurityContext" . | indent 6 }}
      containers:
        - name: frontend
          image: {{ include "legal-rag.image" (dict "root" . "image" .Values.frontend.image) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
{{ include "legal-rag.containerSecurityContext" . | indent 10 }}
          ports:
            - containerPort: 8080
          env:
            - name: VITE_API_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: legal-rag-config
                  key: VITE_API_BASE_URL
          readinessProbe:
            httpGet:
              path: /
              port: 8080
          resources:
{{ toYaml .Values.frontend.resources | indent 12 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-router
  namespace: {{ .Values.namespace.name }}
  labels:
{{ include "legal-rag.labels" (dict "root" . "component" "api-router") | indent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
{{ include "legal-rag.selectorLabels" (dict "component" "api-router") | indent 6 }}
  template:
    metadata:
      labels:
{{ include "legal-rag.selectorLabels" (dict "component" "api-router") | indent 8 }}
{{ include "legal-rag.labels" (dict "root" . "component" "api-router") | indent 8 }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
{{ include "legal-rag.podSecurityContext" . | indent 6 }}
      containers:
        - name: api-router
          image: {{ include "legal-rag.image" (dict "root" . "image" .Values.apiRouter.image) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
{{ include "legal-rag.containerSecurityContext" . | indent 10 }}
          ports:
            - containerPort: 8080
          env:
            - name: AUTH_SERVICE_URL
              value: {{ .Values.apiRouter.routes.authServiceUrl }}
            - name: UPLOAD_SERVICE_URL
              value: {{ .Values.apiRouter.routes.uploadServiceUrl }}
            - name: INGESTION_SERVICE_URL
              value: {{ .Values.apiRouter.routes.ingestionServiceUrl }}
            - name: RAG_SERVICE_URL
              value: {{ .Values.apiRouter.routes.ragServiceUrl }}
          readinessProbe:
            httpGet:
              path: /api/v1/rag/health
              port: 8080
          resources:
{{ toYaml .Values.apiRouter.resources | indent 12 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: {{ .Values.namespace.name }}
  labels:
{{ include "legal-rag.labels" (dict "root" . "component" "auth-service") | indent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
{{ include "legal-rag.selectorLabels" (dict "component" "auth-service") | indent 6 }}
  template:
    metadata:
      labels:
{{ include "legal-rag.selectorLabels" (dict "component" "auth-service") | indent 8 }}
{{ include "legal-rag.labels" (dict "root" . "component" "auth-service") | indent 8 }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
{{ include "legal-rag.podSecurityContext" . | indent 6 }}
      containers:
        - name: auth-service
          image: {{ include "legal-rag.image" (dict "root" . "image" .Values.authService.image) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
{{ include "legal-rag.containerSecurityContext" . | indent 10 }}
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: DATABASE_URL
              valueFrom:
                configMapKeyRef:
                  name: legal-rag-config
                  key: JDBC_DATABASE_URL
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: legal-rag-config
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: DB_PASSWORD
            - name: ADMIN_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: legal-rag-config
                  key: ADMIN_USERNAME
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: ADMIN_PASSWORD
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: JWT_SECRET_KEY
          readinessProbe:
            httpGet:
              path: /api/v1/auth/actuator/health
              port: 8080
            initialDelaySeconds: 30
          resources:
{{ toYaml .Values.authService.resources | indent 12 }}
