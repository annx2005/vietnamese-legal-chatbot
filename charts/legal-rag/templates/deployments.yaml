apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-service
  namespace: {{ .Values.namespace.name }}
  labels:
{{ include "legal-rag.labels" (dict "root" . "component" "rag-service") | indent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
{{ include "legal-rag.selectorLabels" (dict "component" "rag-service") | indent 6 }}
  template:
    metadata:
      labels:
{{ include "legal-rag.selectorLabels" (dict "component" "rag-service") | indent 8 }}
{{ include "legal-rag.labels" (dict "root" . "component" "rag-service") | indent 8 }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
{{ include "legal-rag.podSecurityContext" . | indent 6 }}
      volumes:
        - name: cloudsql
          emptyDir: {}
      containers:
        - name: rag-service
          image: {{ include "legal-rag.image" (dict "root" . "image" .Values.ragService.image) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
{{ include "legal-rag.containerSecurityContext" . | indent 10 }}
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: legal-rag-config
          env:
{{ include "legal-rag.secretEnv" . | indent 12 }}
          volumeMounts:
            - name: cloudsql
              mountPath: /cloudsql
          readinessProbe:
            httpGet:
              path: /api/v1/rag/health
              port: 8000
            initialDelaySeconds: 20
          resources:
{{ toYaml .Values.ragService.resources | indent 12 }}
{{ include "legal-rag.cloudSqlProxy" . | indent 8 }}
