_format_version: "3.0"
_transform: true

services:
  - name: auth-service
    url: http://auth-service:8080
    routes:
      - name: auth-route
        paths:
          - /api/v1/auth
        strip_path: false

  - name: upload-service
    url: http://upload-service:8080
    routes:
      - name: upload-route
        paths:
          - /api/v1/upload
        strip_path: false

  - name: rag-service
    url: http://rag-service:8000
    routes:
      - name: rag-route
        paths:
          - /api/v1/rag
        strip_path: false

  - name: ingestion-service
    url: http://ingestion-service:8000
    routes:
      - name: ingestion-route
        paths:
          - /api/v1/ingest
        strip_path: false

  - name: rag-admin-service
    url: http://rag-service:8000
    routes:
      - name: rag-admin-route
        paths:
          - /api/v1/admin
        strip_path: false

plugins:
  - name: cors
    config:
      origins:
        - "*"
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Accept
        - Authorization
        - Content-Type
        - Origin
      exposed_headers:
        - Content-Length
        - Content-Type
      credentials: false
      max_age: 3600
