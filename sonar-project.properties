sonar.projectKey=annx2005_vietnamese-legal-chatbot
sonar.projectName=vietnamese-legal-chatbot
sonar.organization=${env.SONAR_ORGANIZATION}
sonar.sourceEncoding=UTF-8

sonar.sources=auth-service/src/main,auth-service/pom.xml,auth-service/Dockerfile,upload-service/src/main,upload-service/pom.xml,upload-service/Dockerfile,frontend/src,frontend/index.html,frontend/vite.config.ts,frontend/tsconfig.json,frontend/Dockerfile,frontend/nginx.conf,rag-service/app,rag-service/Dockerfile,rag-service/requirements.txt,ingestion-service/app,ingestion-service/scripts,ingestion-service/Dockerfile,ingestion-service/requirements.txt,api-router,charts,terraform,docker-compose.yml
sonar.tests=auth-service/src/test/java,upload-service/src/test/java

sonar.exclusions=**/target/**,**/node_modules/**,**/dist/**,**/.vite/**,**/__pycache__/**,**/.pytest_cache/**,**/.venv/**,**/venv/**,**/env/**,**/.terraform/**,**/*.tfstate,**/*.tfstate.*,**/mvnw,**/mvnw.cmd,**/package-lock.json
sonar.test.inclusions=**/*Test.java,**/*Tests.java,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/tests/**/*.py,**/test_*.py

sonar.java.binaries=auth-service/target/classes,upload-service/target/classes
sonar.java.test.binaries=auth-service/target/test-classes,upload-service/target/test-classes
sonar.coverage.jacoco.xmlReportPaths=auth-service/target/site/jacoco/jacoco.xml,upload-service/target/site/jacoco/jacoco.xml

sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.typescript.tsconfigPaths=frontend/tsconfig.json
sonar.python.coverage.reportPaths=rag-service/coverage.xml,ingestion-service/coverage.xml
sonar.coverage.exclusions=frontend/src/api.ts,ingestion-service/app/services/ingestion_service.py

sonar.qualitygate.wait=true

sonar.issue.ignore.multicriteria=tfRunAdmin,tfContainerDeveloper,tfCloudSqlSsl,tfGcsVersioning,dockerPipBinary,dockerPipLock,dockerCopyPermissions,k8sWorkloadIdentityToken,uploadSizeLimit,cloudSqlPublicIp,gcsAccessLogging,k8sInternalHttp
