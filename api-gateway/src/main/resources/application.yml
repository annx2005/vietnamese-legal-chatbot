server:
  port: ${API_GATEWAY_PORT:8080}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
      routes:
        - id: auth-service
          uri: http://${AUTH_SERVICE_HOST:auth-service}:${AUTH_SERVICE_PORT:8080}
          predicates:
            - Path=/api/v1/auth/**
        - id: upload-service
          uri: http://${UPLOAD_SERVICE_HOST:upload-service}:${UPLOAD_SERVICE_PORT:8080}
          predicates:
            - Path=/api/v1/upload/**
        - id: rag-service
          uri: http://${RAG_SERVICE_HOST:rag-service}:${RAG_SERVICE_PORT:8000}
          predicates:
            - Path=/api/v1/rag/**
        - id: ingestion-service
          uri: http://${INGESTION_SERVICE_HOST:ingestion-service}:${INGESTION_SERVICE_PORT:8000}
          predicates:
            - Path=/api/v1/ingest/**

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: always
